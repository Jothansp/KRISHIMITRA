services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: krishimitra
      POSTGRES_USER: krishi
      POSTGRES_PASSWORD: krishi
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://krishi:krishi@db:5432/krishimitra
      CORS_ORIGINS: http://localhost:5173
    ports:
      - "8000:8000"
    depends_on:
      - db

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  postgres_data:
